name: GMIS
category: GWM Figures
status: ready
owner: Pawel Poprawski
description: >
  Step 3 of the GMIS chain — consolidates ~100 GMIS export files (txt,
  ~1M rows each) filtered to the GMIS Account Universe into the raw GWM
  database plus per-account groupings.
instructions: |
  ## How to run
  1. Run **GMIS Quick Check** first (reconciliation vs the grouped download)
     and **GMIS Account Filter** (builds the Account Universe list).
  2. Put the GMIS export files (`*.txt`) in the `GMIS DATA\All` folder.
  3. Click **Start** — files are processed one by one (streaming); each chunk
     is filtered to the Account Universe right after reading, before any
     cleaning, so only relevant rows are processed.

  ## Outputs (pipe-delimited CSV)
  * `0. GWM RAW GMIS Universe.csv` — raw GMIS data for the Account Universe
  * `temps/Current GMIS grouping.csv` — unique grouping per account/month
  * `temps/Brokerage per account.csv` — rows with Brokerage revenue sub type
  * `temps/GMIS Mandates per account.csv` — mandate hierarchy per account (IA >= 1)

  ## Notes
  * No deduplication — a green GMIS Quick Check already proves the input
    files contain no duplicates.
  * The grouped-check comparison lives in GMIS Quick Check (comparing a
    filtered subset with the full-population download would always differ).
params:
  - key: period
    label: Period (YYYYMM)
    type: period
    help: Informational — GMIS paths do not depend on the period.
